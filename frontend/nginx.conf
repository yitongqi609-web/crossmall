server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue history 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端(容器访问宿主机上的 8582 后端)
    location /api/ {
        proxy_pass http://host.docker.internal:8582;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
