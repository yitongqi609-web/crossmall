# CrossMall · 潮汐全球购 —— 中间件编排(端口与默认值错开,避免与其他项目共存冲突)
# 启动: docker compose up -d
# MySQL 3311 / Redis 6391 / RocketMQ Namesrv 9882 / Dashboard 9883 / Broker 21911(直连端口,勿改)
services:
  mysql:
    image: mysql:8.4
    container_name: crossmall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Shanghai
    ports:
      - "3311:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    restart: unless-stopped

  redis:
    image: redis:7.4
    container_name: crossmall-redis
    ports:
      - "6391:6379"
    volumes:
      - ./docker/redis/data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: crossmall-namesrv
    ports:
      - "9882:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    command: sh mqnamesrv
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: crossmall-broker
    depends_on:
      - rocketmq-namesrv
    ports:
      - "21911:21911"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
      # broker 对外广播地址必须是宿主机可达地址,宿主机本地启动的后端通过 10911 直连
      BORKER_IP: 127.0.0.1
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    restart: unless-stopped

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: crossmq-dashboard
    depends_on:
      - rocketmq-namesrv
    ports:
      - "9883:8080"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx128m -Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    restart: unless-stopped

  # 前端 nginx(可选):docker compose up -d frontend
  frontend:
    image: nginx:1.25-alpine
    container_name: crossmall-web
    depends_on:
      - mysql
      - redis
    ports:
      - "8091:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
