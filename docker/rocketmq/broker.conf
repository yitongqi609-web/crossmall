brokerClusterName = CrossMallCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 对宿主机本地运行的后端进程广播 127.0.0.1,配合 compose 端口直映射 21911
brokerIP1 = 127.0.0.1
# 监听端口与其他项目的 RocketMQ(10911)错开
listenPort = 21911
# 开发环境自动建 Topic
autoCreateTopicEnable = true
autoCreateSubscriptionGroupEnable = true
# 磁盘水位调低,避免开发机告警拒写
diskMaxUsedSpaceRatio = 95
